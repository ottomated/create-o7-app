name: Test
on:
  pull_request:

jobs:
  create-shards:
    runs-on: ubuntu-slim
    permissions: {}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      shard-count: ${{ steps.shards.outputs.count }}
    steps:
      - name: Generate shards
        id: shards
        run: |
          shard_count=6

          echo "count=[$shard_count]" >> $GITHUB_OUTPUT
          max_shard=$((shard_count - 1))
          echo "shards=[$(seq -s ', ' 0 $max_shard)]" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: create-shards
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.create-shards.outputs.shards) }}
        shard-count: ${{ fromJson(needs.create-shards.outputs.shard-count) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache-cargo
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --component rustfmt

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: ^12.15.0
          runtime: node@lts
          install: false

      - name: Test
        run: cargo test
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shard-count }}

      - name: Save Cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always() && steps.cache-cargo.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache-cargo.outputs.cache-primary-key }}


