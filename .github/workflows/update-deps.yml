name: Update Dependencies
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Detect open PR
        id: detect_open_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:updates`,
            });
            // save pr number to github_env
            if (pullRequests[0]) {
              require('fs').appendFileSync(process.env.GITHUB_ENV,
                `PR_NUMBER=${pullRequests[0].number}\n`
              );
            }

            return pullRequests[0]?.head?.ref ?? 'main';

      - id: create_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.create_token.outputs.token }}
          ref: ${{ steps.detect_open_pr.outputs.result }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: ^11.20.0
          runtime: node@lts
          install: false


      - name: Install Rust
        run: |
          rustup toolchain install stable --component rustfmt

      - name: Do updates
        run: |
          {
            echo 'PR_BODY<<EOF'
            node ./.github/workflows/update_deps.mjs ${PR_BRANCH_NAME}
            echo EOF
          } >> $GITHUB_ENV
        env:
          PR_BRANCH_NAME: ${{ steps.detect_open_pr.outputs.result }}

      - name: Cargo update
        run: cargo update

      - name: Open PR
        if: steps.detect_open_pr.outputs.result == 'main'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.create_token.outputs.token }}
          commit-message: 'ci: Update dependencies'
          title: Update dependencies
          body: ${{ env.PR_BODY }}
          branch: updates

      - name: Push to existing PR
        if: steps.detect_open_pr.outputs.result != 'main'
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 1
          fi
          git add .

          git config --local user.email "create-o7-app@users.noreply.github.com"
          git config --local user.name "create-o7-app[bot]"
          git commit -m "ci: Update dependencies"

          git push origin ${PR_BRANCH_NAME}
        env:
          PR_BRANCH_NAME: ${{ steps.detect_open_pr.outputs.result }}

      - name: Comment on PR
        if: steps.detect_open_pr.outputs.result != 'main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.create_token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              issue_number: ${{ env.PR_NUMBER }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.PR_BODY,
            });
