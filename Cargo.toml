[package]
name = "create-o7-app"
authors = ["Ottomated"]
version = "0.13.4"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
dunce = "1.0.5"
human-repr = "1.1.0"
inquire = "0.9.4"
pathdiff = "0.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.3.0", features = ["json"], default-features = false }
which = "8.0.5"

[build-dependencies]
template_builder = { path = "./template_builder" }

[dev-dependencies]
tempfile = "3.27.0"
itertools = "0.15.0"

[profile.release]
opt-level = 's' # Optimize for size
lto = true
strip = true
